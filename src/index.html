<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MQTT</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- <script type="module" src="scripts/dialog.js" defer></script> -->
  <script type="module" src="scripts/main.js" defer></script>
</head>

<body>

  <div class="titlebar">
    <div id="host-input-wrap">
    </div>
    <div id="addHostWrapper">
      <span id="addHostBtn">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 1V15M1 8H15" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </span>
    </div>
  </div>

  <aside class="sidebar">
    <section>
      <div class="sec-head">Subscriptions</div>
      <div id="topicList"></div>
      <div class="sub-add">
        <input type="text" id="subInput" placeholder="topic/#" spellcheck="false">
        <button id="subBtn" class="icon" title="Subscribe">+</button>
      </div>
    </section>
  </aside>

  <main class="main">
    <div class="streambar">
      <input type="text" id="filter" placeholder="Filter topic or payload" spellcheck="false">
      <span class="spacer"></span>
      <span class="count" id="count">0 messages</span>
      <button id="clearBtn">Clear</button>
    </div>

    <div class="stream" id="stream"></div>
    <button class="jump" id="jump">Jump to latest</button>

    <div class="composer">
      <div class="row">
        <input type="text" id="pubTopic" placeholder="Publish to topic" spellcheck="false">
      </div>
      <div class="row">
        <textarea id="pubPayload" placeholder="Payload" spellcheck="false"></textarea>
      </div>
      <div class="row">
        <span class="seg-label">QoS</span>
        <div class="seg" id="qos">
          <button data-q="0" aria-pressed="true">0</button>
          <button data-q="1" aria-pressed="false">1</button>
          <button data-q="2" aria-pressed="false">2</button>
        </div>
        <label class="check"><input type="checkbox" id="retain"> Retain</label>
        <span class="spacer"></span>
        <button id="formatBtn">Format JSON</button>
        <button id="pubBtn" class="primary">Publish</button>
      </div>
    </div>
  </main>

</body>

<dialog id="inputDialog">
  <form method="dialog">
    <p>Add new connection:</p>
    <input type="text" id="dialogInput" placeholder="HOST:PORT" style="margin-bottom: 10px; display: block;" />

    <p>Tailscale Peer Info:</p>
    <select id="tailscalePeerInfo"></select>


    <menu style="display: flex; justify-content: flex-end; gap: 8px; margin: 0; padding: 0;">
      <button id="confirmBtn" value="default" style="display: none;">Submit</button>
      <button value="cancel">Cancel</button>
      <button id="confirmBtn" value="default">Submit</button>
    </menu>
  </form>
</dialog>

</html>
